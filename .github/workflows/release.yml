name: Publication Automatisée des Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Signature & Release Windows (Tauri v2)
    runs-on: windows-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de l'environnement Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Installation de la toolchain Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache des dépendances Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Installation des dépendances NPM
        run: npm ci

      - name: Exécution des tests automatisés
        run: npm run test

      - name: Compilation du frontend (Vite / TypeScript)
        run: npm run build

      - name: Compilation des installeurs Tauri v2 (NSIS & MSI)
        run: npm run tauri:build

      - name: Archivage des binaires non signés
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-binaries
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      # Signature de code via SignPath Foundation (Actif dès que les variables/secrets sont configurés)
      - name: Soumission de signature à SignPath Foundation
        id: signpath
        if: "${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}"
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'openpdf' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: './signed-output'

      - name: Préparation des fichiers d'installation pour la Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ./release-assets | Out-Null
          $signedFiles = if (Test-Path ./signed-output) { Get-ChildItem -Path ./signed-output -File -Recurse } else { @() }
          if ($signedFiles.Count -gt 0) {
            Write-Host "Utilisation des binaires officiellement signés par SignPath Foundation..."
            $signedFiles | Copy-Item -Destination ./release-assets/
          } else {
            Write-Host "SignPath en attente de configuration : utilisation des binaires compilés..."
            Get-ChildItem -Path src-tauri/target/release/bundle -Include *.exe,*.msi -Recurse -File -ErrorAction SilentlyContinue | Copy-Item -Destination ./release-assets/
          }
          Write-Host "Calcul des empreintes SHA-256..."
          $files = Get-ChildItem -Path ./release-assets -File
          $checksumLines = @()
          foreach ($f in $files) {
            $h = Get-FileHash -Path $f.FullName -Algorithm SHA256
            $checksumLines += ($h.Hash.ToLower() + "  " + $f.Name)
          }
          $checksumLines | Set-Content -Path ./release-assets/checksums-sha256.txt -Encoding utf8
          Write-Host "Fichiers prêts pour la publication de la Release :"
          Get-ChildItem ./release-assets/

      - name: Publication de la GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: 'OpenPDF ${{ github.ref_name }}'
          files: ./release-assets/*
          body: |
            Bienvenue dans la version **${{ github.ref_name }}** d'**OpenPDF** ! 🎉
            
            ### 📥 Fichiers d'installation disponibles ci-dessous :
            - **`OpenPDF_${{ github.ref_name }}_x64-setup.exe`** : Installeur standard NSIS (recommandé pour Windows, aucune élévation de privilèges requise).
            - **`OpenPDF_${{ github.ref_name }}_x64_en-US.msi`** : Package MSI pour déploiement en entreprise ou installation automatisée.
            - **`checksums-sha256.txt`** : Empreintes de contrôle cryptographiques pour vérifier l'intégrité des fichiers téléchargés.
            
            ### 🛡️ Signature de code & Sécurité :
            Ces exécutables sont construits de manière vérifiable et reproductible par GitHub Actions et certifiés via **SignPath Foundation** pour garantir une exécution sûre et sans avertissement sous Microsoft SmartScreen.
            
            ### 📜 Détail des changements et nouveautés :
            Pour consulter l'historique complet et l'explication de chaque évolution, référez-vous au [Journal des Modifications (CHANGELOG.md)](https://github.com/SharkLog76/OpenPDF/blob/main/CHANGELOG.md).
          draft: false
          prerelease: false
