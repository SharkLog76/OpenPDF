[package]
name = "openpdf"
version = "0.1.2"
description = "OpenPDF — Studio PDF local-first (lecture, édition, signature, conversion)"
authors = ["OpenPDF"]
edition = "2021"

[lib]
name = "openpdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
